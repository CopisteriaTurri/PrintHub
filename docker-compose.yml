# Print Hub in produzione. Variabili in .env (vedi .env.example).
services:
  printhub-db:
    image: postgres:17
    environment:
      POSTGRES_DB: printhub
      POSTGRES_USER: printhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD in .env}
    volumes:
      - /mnt/nvme/docker/printhub/postgres_data:/var/lib/postgresql/data
    networks: [printhub]
    restart: unless-stopped

  # Valkey: fork di Redis con licenza BSD, stesso protocollo. Solo canale tra
  # processi: niente persistenza su disco.
  printhub-valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    networks: [printhub]
    restart: unless-stopped

  printhub:
    image: localhost:5000/printhub:latest
    env_file: .env
    environment:
      DATABASE_URL: postgres://printhub:${POSTGRES_PASSWORD}@printhub-db:5432/printhub
      CHANNEL_LAYER_URL: redis://printhub-valkey:6379/0
      MEDIA_ROOT: /app/media
    volumes:
      - /mnt/nvme/docker/printhub/media:/app/media
    ports:
      - "8010:8000"
    depends_on: [printhub-db, printhub-valkey]
    networks: [printhub, cloudflared-copturri]
    restart: unless-stopped

  # Manutenzione ogni ora: lavori scaduti e file oltre la retention (§8).
  printhub-housekeeping:
    image: localhost:5000/printhub:latest
    env_file: .env
    environment:
      DATABASE_URL: postgres://printhub:${POSTGRES_PASSWORD}@printhub-db:5432/printhub
      MEDIA_ROOT: /app/media
    volumes:
      - /mnt/nvme/docker/printhub/media:/app/media
    entrypoint: ["sh", "-c", "while true; do python manage.py housekeeping; sleep 3600; done"]
    depends_on: [printhub]
    networks: [printhub]
    restart: unless-stopped

networks:
  printhub:
  cloudflared-copturri:
    external: true
